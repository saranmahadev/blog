# Grouped, weekly, so updates arrive as a few small pull requests instead of a flood. Nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # TypeScript is held back on purpose: Astro's type checker and the tooling around it are not on the next major yet.
    ignore:
      - { dependency-name: typescript, update-types: ['version-update:semver-major'] }
    groups:
      astro: { patterns: ['astro', '@astrojs/*'] }
      firebase: { patterns: ['firebase', 'firebase-tools', '@firebase/*'] }
      tooling: { dependency-type: development, exclude-patterns: ['astro', '@astrojs/*', 'firebase-tools', '@firebase/*'] }
  - package-ecosystem: npm
    directory: /functions
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      - { dependency-name: typescript, update-types: ['version-update:semver-major'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ['*'] }
