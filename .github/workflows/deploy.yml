name: Build and deploy

# Never runs on every commit. It runs when:
#   - a commit lands on main (build + deploy)
#   - the "ci" label is added to a pull request (build and checks only, no deploy)
#   - someone starts it by hand from the Actions tab (build only; deploys only if run on main)
# To re-check a PR after new commits, remove and re-add the "ci" label, or run it by hand.
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

# One deploy at a time; never cancel one that is already running.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation (no long-lived keys)

env:
  FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Chrome (renders Mermaid diagrams at build time)
        run: google-chrome --version
      - run: pnpm check
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    # Only from main, and skipped until the repository variable below is configured.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT"
