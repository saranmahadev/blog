name: Build and deploy

# Never runs on every commit. It runs when:
#   - a commit lands on main (build + deploy to production)
#   - the "build" label is added to a pull request (build and checks only)
#   - the "deploy-preview" label is added to a pull request (build, then a temporary preview URL)
#   - someone starts it by hand from the Actions tab (build only; deploys only if run on main)
# To re-run for a PR after new commits, remove and re-add the label, or run it by hand.
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

# One deploy at a time; never cancel one that is already running.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation (no long-lived keys)

env:
  FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(fromJSON('["build","deploy-preview"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Chrome (renders Mermaid diagrams at build time)
        run: google-chrome --version
      - run: pnpm check
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Firestore security rules and Cloud Functions compile. Rules run against the local emulator.
  backend:
    if: github.event_name != 'pull_request' || contains(fromJSON('["build","deploy-preview"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Firestore rules tests
        run: pnpm test:rules
      - name: Cloud Functions compile
        run: cd functions && npm ci --no-audit --no-fund && npx tsc --noEmit

  # Quality gates run on the built site. A failure here blocks both deploy and preview.
  gates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Internal links and anchors
        run: pnpm check:links
      - name: Accessibility (axe, light and dark)
        run: pnpm check:a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Lighthouse budgets
        run: pnpm check:lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7

  deploy:
    needs: [build, gates, backend]
    # Only from main, and skipped until the repository variable below is configured.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT"

  preview:
    needs: [build, gates, backend]
    if: github.event_name == 'pull_request' && github.event.label.name == 'deploy-preview' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy preview channel (expires in 7 days)
        run: npx --yes firebase-tools@latest hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --expires 7d --project "$FIREBASE_PROJECT"
