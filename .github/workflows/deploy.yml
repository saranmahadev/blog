name: Build and deploy

# Never runs on every commit. It runs when:
#   - a commit lands on main (build + deploy to production)
#   - the "build" label is added to a pull request (build and checks only)
#   - the "deploy-preview" label is added to a pull request (build, then a temporary preview URL)
#   - someone starts it by hand from the Actions tab (build only; deploys only if run on main)
# To re-run for a PR after new commits, remove and re-add the label, or run it by hand.
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

# One deploy at a time; never cancel one that is already running. Pull request runs have their own group so a labelled
# pull request (including bot update PRs) can never queue behind, or replace, a deploy waiting on main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy-main' }}
  cancel-in-progress: false

# Least privilege: jobs only read the repository. Only the jobs that publish also get an OIDC token (below).
permissions:
  contents: read

env:
  FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # silences the Node 20 deprecation notice for the actions below

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(fromJSON('["build","deploy-preview"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Chrome (renders Mermaid diagrams at build time)
        run: google-chrome --version
      - run: pnpm check
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          include-hidden-files: true # .well-known/security.txt

  # Firestore security rules and Cloud Functions compile. Rules run against the local emulator.
  backend:
    if: github.event_name != 'pull_request' || contains(fromJSON('["build","deploy-preview"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Firestore rules tests
        run: pnpm test:rules
      - name: Cloud Functions compile
        run: cd functions && npm ci --no-audit --no-fund && npx tsc --noEmit
      # Signed-in screens against the local emulators: sign in through the real form, scan with axe in light and dark,
      # and fail on any Content-Security-Policy violation. Uses a throwaway build pointed at the emulators.
      - name: Signed-in screens (accessibility, policy, inbox)
        run: |
          pnpm build
          pnpm check:signed-in
        env:
          PUBLIC_USE_EMULATORS: 'true'
          PUBLIC_FIREBASE_API_KEY: demo-key
          PUBLIC_FIREBASE_PROJECT_ID: demo-drafted
          PUBLIC_FIREBASE_AUTH_DOMAIN: demo-drafted.firebaseapp.com
          PUBLIC_FIREBASE_APP_ID: 1:1:web:1
          CHROME_PATH: /usr/bin/google-chrome

  # Quality gates run on the built site. A failure here blocks both deploy and preview.
  gates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Internal links and anchors
        run: pnpm check:links
      - name: Feeds (RSS, Atom, JSON Feed)
        run: pnpm check:feeds
      - name: Content Security Policy (no violations in a real browser)
        run: pnpm check:csp
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Accessibility (axe, light and dark)
        run: pnpm check:a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Lighthouse budgets
        run: pnpm check:lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7

  deploy:
    needs: [build, gates, backend]
    # Only from main, and skipped until the repository variable below is configured.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation (no long-lived keys)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      # Backend first, so the site never goes live calling a function or rule that is not there yet.
      # Opt in with the repository variable DEPLOY_BACKEND=true (after granting the deploy account its roles; see README).
      # The Firebase CLI is the version pinned in pnpm-lock.yaml, never "latest", because it runs with deploy credentials.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Firestore rules, indexes and Cloud Functions
        if: vars.DEPLOY_BACKEND == 'true'
        run: |
          # Only the functions defined in this repo are deployed (never the rest of a shared project).
          FUNCS=$(grep -oP '^export const \K\w+' functions/src/index.ts | sed 's/^/functions:/' | paste -sd, -)
          echo "Deploying: firestore:rules,firestore:indexes,$FUNCS"
          pnpm exec firebase deploy --only "firestore:rules,firestore:indexes,$FUNCS" --project "$FIREBASE_PROJECT" --non-interactive
      - name: Remove retired Cloud Functions
        if: vars.DEPLOY_BACKEND == 'true'
        run: |
          # Functions this repo used to have and no longer does. Listed by name so nothing else in a shared project is touched;
          # already-deleted ones are skipped. Add a name here when you remove a function from functions/src/index.ts.
          for F in onUserCreated; do
            pnpm exec firebase functions:delete "$F" --region asia-south1 --project "$FIREBASE_PROJECT" --force || echo "$F: nothing to delete"
          done
      - name: Deploy to Firebase Hosting
        run: pnpm exec firebase deploy --only hosting --project "$FIREBASE_PROJECT"

  preview:
    needs: [build, gates, backend]
    if: github.event_name == 'pull_request' && github.event.label.name == 'deploy-preview' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy preview channel (expires in 7 days)
        run: pnpm exec firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --expires 7d --project "$FIREBASE_PROJECT"
