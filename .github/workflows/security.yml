name: Security

# Weekly, by hand, and when dependencies change on main. Never on every commit.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', 'pnpm-lock.yaml', 'functions/package.json', 'functions/package-lock.json']

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # High and critical advisories fail the run. Ones with no fix that cannot be reached here are listed, with the reason, in package.json (pnpm.auditConfig).
      - name: Site and build tools
        run: pnpm audit --audit-level=high
      - name: Cloud Functions
        run: cd functions && npm ci --no-fund && npm audit --omit=dev --audit-level=moderate

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
